name: Release

on:
  push:
    tags:
      - 'v*.*.*'

env:
  IMAGE_REPO: ${{ secrets.DOCKERHUB_USERNAME }}/property-service

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10 (preview)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: preview

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal

  build:
    runs-on: ubuntu-latest
    needs: test
    environment: prod

    steps:
      - uses: actions/checkout@v4

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          IMAGE_TAG=${GITHUB_REF#refs/tags/}
          echo "Building image with tag $IMAGE_TAG"
          docker build -t $IMAGE_REPO:$IMAGE_TAG .
          docker push $IMAGE_REPO:$IMAGE_TAG

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment: prod

    steps:
      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 --decode > $HOME/.kube/config

      - name: Checkout Helm repo
        uses: actions/checkout@v4
        with:
          repository: APSList/Hostflow
          path: Hostflow
          token: ${{ secrets.GH_TOKEN }}

      - name: Deploy to PROD with Helm
        run: |
          IMAGE_TAG=${GITHUB_REF#refs/tags/}
          helm upgrade --install property-service-prod ./Hostflow/helm/charts/property-service \
            --namespace prod \
            --create-namespace \
            --set image.repository=$IMAGE_REPO \
            --set image.tag=$IMAGE_TAG \
            --set image.pullPolicy=Always
            --set actualSecrets.DB_URL_PROPERTY="${{ secrets.DB_URL_PROPERTY }}"
            --set actualSecrets.DB_STORAGE_BUCKET="${{ secrets.DB_STORAGE_BUCKET}}"
            --set actualSecrets.DB_SERVICE_ROLE_KEY="${{ secrets.DB_SERVICE_ROLE_KEY }}"
            --set actualSecrets.DB_URL_STORAGE="${{ secrets.DB_URL_STORAGE }}"